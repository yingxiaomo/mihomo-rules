name: Train and Deploy PLD Smart Model

# ⚠️ 本工作流默认【定时自动触发】：每周日 22:30 UTC（周一 6:30 北京时间）
# 自动拉取 Google Drive 的 CSV 训练并发布 smart-pld-model，训练脚本变更时
# 也会触发。运行前需在仓库 Secrets 配置：
#   RCLONE_CONFIG_B64 — rclone.conf 的 base64（需含 gdrive 远程）
#   REMOTE           — 数据目录，如 gdrive:smart_data
#   TG_BOT_TOKEN / TG_CHAT_ID — 训练结果通知（可选）
on:
  push:
    branches:
      - main
    paths:
      - 'smart_trainer/train_pld.py'
      - '.github/workflows/train-pld.yml'
  schedule:
    # 每周一早上 6:30 (中国时间, UTC+8) = 每周日 22:30 UTC
    - cron: '30 22 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  train_and_deploy:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      REMOTE: ${{ secrets.REMOTE }}
      LATEST_TAG: smart-pld-model

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r smart_trainer/requirements.txt

      - name: Set up rclone config
        run: |
          echo "$RCLONE_CONFIG_B64" | base64 -d > rclone.conf

      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Pull CSV from Google Drive
        run: |
          rclone copy "$REMOTE" ./ --config rclone.conf --transfers=4 --checkers=8 --log-level=INFO

      - name: Check for CSV data files
        run: |
          if ! ls *.csv &> /dev/null; then
            echo "::error::No CSV data files found in the root directory. Cannot proceed with training."
            exit 1
          fi

      - name: Run PLD training script
        id: training
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail
          python smart_trainer/train_pld.py --data_dir .

      - name: Upload model artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: pld-model-artifact
          path: Model.bin

      - name: Publish PLD Smart Model
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NOTES="✨ PLD Prior 模型自动训练完成。<br><br>📅 时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')<br>🔗 Commit: ${{ github.sha }}<br>🆔 Run ID: ${{ github.run_id }}<br><br>特征: mmihos PLD 30 特征(reward label)<br>内核对齐: component/smart/lightgbm/prior.go"
          gh release delete "$LATEST_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$LATEST_TAG" \
            --title "PLD Smart Model" \
            --notes "$RELEASE_NOTES" \
            --target main \
            --latest
          gh release upload "$LATEST_TAG" Model.bin --clobber

      - name: Cleanup
        if: always()
        run: |
          if [ -f "rclone.conf" ]; then rm rclone.conf; fi
          rm -f *.csv smart_trainer/training_pld.log