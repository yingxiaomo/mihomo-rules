name: Train and Deploy Sage Dimensional Priors

# 与 train-pld.yml 并存，但只消费 Sage 内核原生事件；PLD 链路保持独立。
# 每周日 23:00 UTC（周一 07:00 北京时间）自动训练。
on:
  push:
    branches: [main]
    paths:
      - 'smart_trainer/train_sage_prior.py'
      - 'smart_trainer/sage_workflow_notify.py'
      - 'smart_trainer/test_sage_*.py'
      - 'smart_trainer/test_train_sage_prior.py'
      - 'smart_trainer/requirements-sage.txt'
      - 'smart_trainer/upsage.sh'
      - 'smart_trainer/update_sage_prior.sh'
      - 'tests/fixtures/sage_prior/**'
      - '.github/workflows/train-sage-prior.yml'
  schedule:
    - cron: '0 23 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train_and_deploy:
    runs-on: ubuntu-latest
    outputs:
      failed_step: ${{ steps.record_result.outputs.failed_step }}
      release_tag: ${{ steps.record_result.outputs.release_tag }}
      bundle_sha: ${{ steps.record_result.outputs.bundle_sha }}
    env:
      RELEASE_TAG: sage-prior-model-${{ github.run_number }}
      SAGE_CONSUMER_SHA: 9c92dbf80c8997bbfe1a2f4e986aa45f75f3a786

    steps:
      - name: Checkout repository at triggering commit
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        id: setup_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        id: install_dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r smart_trainer/requirements-sage.txt

      - name: Run full trainer test matrix
        id: unit_tests
        run: python -m unittest discover -s smart_trainer -p 'test_*.py' -v

      - name: Set up rclone
        id: setup_rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Pull immutable native-event snapshot
        id: pull_snapshot
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          REMOTE: ${{ secrets.REMOTE }}
        run: |
          umask 077
          trap 'rm -f rclone.conf' EXIT
          echo "$RCLONE_CONFIG_B64" | base64 -d > rclone.conf
          mkdir -p sage-data
          rclone copy "${REMOTE}/sage-native" "${GITHUB_WORKSPACE}/sage-data" \
            --config rclone.conf --transfers=4 --checkers=8 --log-level=INFO \
            --include "*.jsonl.ready" --include "*.jsonl.failed" --include "*.jsonl.recovered"
          test -n "$(find sage-data -type f -name '*.jsonl.ready' -print -quit)" || { echo "::error::No closed Sage native-event files found."; exit 1; }

      - name: Train four native dimensional priors
        id: train
        run: |
          set -o pipefail
          python smart_trainer/train_sage_prior.py \
            --data-dir sage-data --output SagePrior.json \
            --evidence-output SagePrior.evidence.json \
            --log-file smart_trainer/training_sage.log \
            --training-commit "$GITHUB_SHA" --consumer-commit "$SAGE_CONSUMER_SHA"

      - name: Checkout exact Go consumer
        id: checkout_consumer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: yingxiaomo/mihomo
          ref: ${{ env.SAGE_CONSUMER_SHA }}
          path: go-consumer
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Go consumer revision
        id: verify_consumer_revision
        run: test "$(git -C go-consumer rev-parse HEAD)" = "$SAGE_CONSUMER_SHA"

      - name: Set up Go for cross-language verification
        id: setup_go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: go-consumer/go.sum

      - name: Verify bundle with the real Go consumer
        id: verify_bundle
        run: |
          mapfile -t MODELS < <(jq -r '.dimensions[].model' SagePrior.json)
          mkdir -p go-consumer/prior-integration
          cp SagePrior.json "${MODELS[@]}" go-consumer/prior-integration/
          cd go-consumer
          SAGE_PRIOR_BUNDLE=prior-integration/SagePrior.json go test ./adapter/outboundgroup -run TestSagePriorExternalBundle -count=1

      - name: Build self-contained prior bundle
        id: build_bundle
        run: |
          mapfile -t MODELS < <(jq -r '.dimensions[].model' SagePrior.json | sort)
          TZ=UTC touch -t 198001010000 SagePrior.json SagePrior.evidence.json "${MODELS[@]}"
          zip -X -j SagePrior-v1.zip SagePrior.json SagePrior.evidence.json "${MODELS[@]}"
          sha256sum SagePrior-v1.zip > SagePrior-v1.zip.sha256
          BUNDLE_SHA="$(cut -d ' ' -f1 SagePrior-v1.zip.sha256)"
          echo "BUNDLE_SHA=$BUNDLE_SHA" >> "$GITHUB_ENV"
          {
            echo "========================================================================"
            echo "[步骤6] 构建可发布模型包"
            echo "========================================================================"
            echo "📦 bundle: $(cat SagePrior-v1.zip.sha256)"
            echo "📌 trainer: ${GITHUB_SHA}"
            echo "📌 consumer: ${SAGE_CONSUMER_SHA}"
          } | tee -a smart_trainer/training_sage.log

      - name: Upload prior bundle artifact
        id: upload_bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sage-prior-bundle-${{ github.run_attempt }}
          path: |
            SagePrior-v1.zip
            SagePrior-v1.zip.sha256

      - name: Upload detailed Sage training evidence
        id: upload_training_evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sage-training-evidence-${{ github.run_attempt }}
          path: |
            smart_trainer/training_sage.log
            SagePrior.evidence.json

      - name: Publish Sage prior bundle
        id: publish_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_NOTES="Sage 原生四维先验自动训练完成。<br><br>Trainer commit: ${GITHUB_SHA}<br>Consumer commit: ${SAGE_CONSUMER_SHA}<br>Run ID: ${{ github.run_id }}<br>Bundle SHA256: ${BUNDLE_SHA}<br><br>训练证据见 SagePrior.evidence.json；只消费 native event schema，与 PLD PriorModel.bin 互不覆盖。"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
            test "$(gh release view "$RELEASE_TAG" --json targetCommitish --jq '.targetCommitish')" = "$GITHUB_SHA"
          else
            gh release create "$RELEASE_TAG" --title "Sage Dimensional Priors" --notes "$RELEASE_NOTES" --target "$GITHUB_SHA" --draft
          fi
          gh release upload "$RELEASE_TAG" SagePrior-v1.zip SagePrior-v1.zip.sha256 --clobber
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | sort | join(",")')" = "SagePrior-v1.zip,SagePrior-v1.zip.sha256"
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          gh release download "$RELEASE_TAG" --dir "$VERIFY_DIR" --pattern 'SagePrior-v1.zip*'
          (cd "$VERIFY_DIR" && sha256sum --check SagePrior-v1.zip.sha256)
          cmp SagePrior-v1.zip "$VERIFY_DIR/SagePrior-v1.zip"
          cmp SagePrior-v1.zip.sha256 "$VERIFY_DIR/SagePrior-v1.zip.sha256"
          gh release edit "$RELEASE_TAG" --notes "$RELEASE_NOTES" --draft=false --latest=false

      - name: Preserve Sage evidence after failure
        id: preserve_failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sage-training-failed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            smart_trainer/training_sage.log
            SagePrior.evidence.json
          if-no-files-found: warn

      - name: Cleanup
        id: cleanup
        if: always()
        run: rm -rf rclone.conf sage-data go-consumer SagePrior*.lgb SagePrior.json SagePrior.evidence.json SagePrior-v1.zip* smart_trainer/training_sage.log

      - name: Record final result for independent notification
        id: record_result
        if: always()
        env:
          FAILED_STEP: >-
            ${{ steps.checkout.outcome == 'failure' && 'Checkout repository' || steps.setup_python.outcome == 'failure' && 'Set up Python' || steps.install_dependencies.outcome == 'failure' && 'Install Python dependencies' || steps.unit_tests.outcome == 'failure' && 'Run full trainer test matrix' || steps.setup_rclone.outcome == 'failure' && 'Set up rclone' || steps.pull_snapshot.outcome == 'failure' && 'Pull immutable native-event snapshot' || steps.train.outcome == 'failure' && 'Train four native dimensional priors' || steps.checkout_consumer.outcome == 'failure' && 'Checkout exact Go consumer' || steps.verify_consumer_revision.outcome == 'failure' && 'Verify Go consumer revision' || steps.setup_go.outcome == 'failure' && 'Set up Go' || steps.verify_bundle.outcome == 'failure' && 'Verify bundle with Go consumer' || steps.build_bundle.outcome == 'failure' && 'Build prior bundle' || steps.upload_bundle.outcome == 'failure' && 'Upload prior bundle artifact' || steps.upload_training_evidence.outcome == 'failure' && 'Upload training evidence' || steps.publish_release.outcome == 'failure' && 'Publish Sage prior bundle' || steps.preserve_failure.outcome == 'failure' && 'Preserve failure evidence' || steps.cleanup.outcome == 'failure' && 'Cleanup' || '' }}
        run: |
          echo "failed_step=$FAILED_STEP" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "bundle_sha=${BUNDLE_SHA:-}" >> "$GITHUB_OUTPUT"

  notify:
    needs: train_and_deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notifier at triggering commit
        id: checkout_notifier
        continue-on-error: true
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Notify final workflow outcome
        if: always()
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PIPELINE_RESULT: ${{ needs.train_and_deploy.result }}
          FAILED_STEP: ${{ needs.train_and_deploy.outputs.failed_step }}
          RELEASE_TAG: ${{ needs.train_and_deploy.outputs.release_tag }}
          BUNDLE_SHA: ${{ needs.train_and_deploy.outputs.bundle_sha }}
          SAGE_CONSUMER_SHA: 9c92dbf80c8997bbfe1a2f4e986aa45f75f3a786
        run: |
          set +x
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::warning::Telegram credentials are unavailable"
            exit 0
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -f smart_trainer/sage_workflow_notify.py ]; then
            if [ "$PIPELINE_RESULT" = success ]; then
              python smart_trainer/sage_workflow_notify.py --status success \
                --run-url "$RUN_URL" --release-tag "$RELEASE_TAG" \
                --training-commit "$GITHUB_SHA" --consumer-commit "$SAGE_CONSUMER_SHA" \
                --bundle-sha "$BUNDLE_SHA"
            else
              [ -n "$FAILED_STEP" ] || FAILED_STEP="Job ${PIPELINE_RESULT}"
              python smart_trainer/sage_workflow_notify.py --status failure \
                --failed-step "$FAILED_STEP" --run-url "$RUN_URL" \
                --release-tag "$RELEASE_TAG" --training-commit "$GITHUB_SHA" \
                --consumer-commit "$SAGE_CONSUMER_SHA"
            fi
            exit 0
          fi
          if [ "$PIPELINE_RESULT" = success ]; then
            TEXT="✅ Sage 四维先验全链路成功 | release=${RELEASE_TAG} | trainer=${GITHUB_SHA} | consumer=${SAGE_CONSUMER_SHA} | bundle=${BUNDLE_SHA} | ${RUN_URL}"
          else
            [ -n "$FAILED_STEP" ] || FAILED_STEP="Job ${PIPELINE_RESULT}"
            TEXT="❌ Sage 四维先验流程失败 | step=${FAILED_STEP} | trainer=${GITHUB_SHA} | consumer=${SAGE_CONSUMER_SHA} | ${RUN_URL}"
          fi
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          DELIVERED=false
          for DELAY in 0 2 4; do
            sleep "$DELAY"
            HTTP_CODE="$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out '%{http_code}' \
              --request POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT_ID}" --data-urlencode "text=${TEXT}" || true)"
            if [ "$HTTP_CODE" = 200 ] && jq -e '.ok == true' "$RESPONSE_FILE" >/dev/null 2>&1; then
              DELIVERED=true
              break
            fi
          done
          [ "$DELIVERED" = true ] || echo "::warning::Telegram final notification was not delivered"
          exit 0
