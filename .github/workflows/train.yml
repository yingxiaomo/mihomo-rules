name: Train and Deploy Smart Model

on:
  push:
    branches:
      - main
    paths:
      - 'smart_trainer/**'
      - '.github/workflows/train.yml'
  schedule:
    # 每周一早上 6:30 (中国时间, UTC+8) = 每周日 22:30 UTC
    - cron: '30 22 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  train_and_deploy:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      REMOTE: ${{ secrets.REMOTE }}
      LATEST_TAG: smart-model
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r smart_trainer/requirements.txt

      - name: Set up rclone config
        run: |
          echo "$RCLONE_CONFIG_B64" | base64 -d > rclone.conf

      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Pull CSV from Google Drive
        run: |
          rclone copy "$REMOTE" ./ --config rclone.conf --transfers=4 --checkers=8 --log-level=INFO

      - name: Check for CSV data files
        run: |
          if ! ls *.csv &> /dev/null; then
            echo "::error::No CSV data files found in the root directory. Cannot proceed with training."
            exit 1
          fi

      - name: Run training script
        id: training
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -o pipefail
          python smart_trainer/train.py --data_dir .

      - name: Upload model artifact
        if: success() 
        uses: actions/upload-artifact@v6
        with:
          name: model-artifact
          path: Model.bin

      - name: Publish Smart Model
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NOTES="✨ 模型自动训练完成。<br><br>📅 时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')<br>🔗 Commit: ${{ github.sha }}<br>🆔 Run ID: ${{ github.run_id }}"
          # GitHub 无法修改已有 release 的发布时间，因此每次运行都删除旧 release+tag 再重建，让发布时间和 tag 保持最新
          gh release delete "$LATEST_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$LATEST_TAG" \
            --title "Smart Model" \
            --notes "$RELEASE_NOTES" \
            --target main \
            --latest
          gh release upload "$LATEST_TAG" Model.bin --clobber

      - name: Cleanup
        if: always()
        run: |
          if [ -f "rclone.conf" ]; then rm rclone.conf; fi
          rm -f *.csv smart_trainer/training.log