# 规则匹配
rules:
  # 屏蔽 QUIC (UDP 443)，强制浏览器使用 TCP，避免 UDP 代理失败导致重复匹配
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT
  # 组播/广播放行 (智能家居发现协议 SSDP/mDNS)
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR,239.255.255.250/32,DIRECT,no-resolve
  - IP-CIDR,255.255.255.255/32,DIRECT,no-resolve
  - IP-CIDR6,ff00::/8,DIRECT,no-resolve
  # 1. 基础通信放行 (P2P打洞端口)
  - DST-PORT,3478,DIRECT
  - DST-PORT,19302,DIRECT
  # 2. 屏蔽广告
  - GEOSITE,category-ads-all, REJECT

  # 3. 管理
  - RULE-SET,私有域名, 直连
  - RULE-SET,私有ip, 直连,no-resolve

  # 4. 网络测试
  - RULE-SET,网络测试, 网络测试

  # 5. 谷歌/消息推送
  - RULE-SET,谷歌FCM, 香港自动

  # 6. AI 服务
  - RULE-SET,ChatGPT, AI服务
  - RULE-SET,Claude, AI服务
  - RULE-SET,Meta AI, AI服务
  - RULE-SET,Perplexity, AI服务
  - RULE-SET,Gemini, AI服务
  - RULE-SET,Copilot, AI服务
  - RULE-SET,AI服务, AI服务

  # 7. 特定流媒体与大厂服务
  - RULE-SET,电报域名, 电报消息
  - RULE-SET,电报ip, 电报消息, no-resolve
  - RULE-SET,油管视频, 油管视频
  - RULE-SET,Twitter, Twitter
  - RULE-SET,TikTok, TikTok
  - RULE-SET,GitHub, GitHub
  - RULE-SET,Bybit, Bybit服务
  - RULE-SET,谷歌cn, 直连
  - RULE-SET,谷歌域名, 谷歌服务
  - RULE-SET,谷歌ip, 谷歌服务, no-resolve
  - RULE-SET,苹果cn, 直连
  - RULE-SET,苹果服务, 苹果服务
  - RULE-SET,微软cn, 直连
  - RULE-SET,微软云盘, 微软云盘
  - RULE-SET,微软服务, 微软服务
  - RULE-SET,Cloudflare, Cloudflare

  # 8. 下载 (BT trackers)
  - RULE-SET,trackerslist, 直连
  # 9. 游戏相关
  - RULE-SET,游戏下载, 直连
  - RULE-SET,游戏平台, 游戏平台

  # 10. 通用分流规则
  - RULE-SET,代理顶级域名, 代理域名
  - RULE-SET,代理域名, 代理域名
  - RULE-SET,直连域名, 直连

  # 11. 默认规则
  - RULE-SET,国内ip, 直连, no-resolve
  # 12. 放行所有未被上方规则截获的未知 UDP 流量
  - NETWORK,udp,DIRECT
  - MATCH, 漏网之鱼


# 规则集类型锚点
ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
domain_text: &domain_text {type: http, interval: 86400, behavior: domain, format: text}
class: &class {type: http, interval: 86400, behavior: classical, format: text}


