# 嗅探
sniffer:
  enable: true
  force-dns-mapping: true                                          # 对 redir-host 类型识别的流量进行强制嗅探
  parse-pure-ip: true                                              # 对所有ip进行强制嗅探
  override-destination: true                                       # 是否使用嗅探结果作为实际访问
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.miwifi.com"
    - "+.mi.com"
    - "+.xiaomi.com"
    - "+.miui.com"
    - "connect.rom.miui.com"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"
    - "router.asus.com"
    - "tplogin.cn"
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"                                # Windows 网络连接测试
    - "+.msftncsi.com"                                       # Windows 网络状态指示器


# 入站
# 通用 TUN/DNS 配置参考官方文档：
# https://wiki.metacubex.one/config/inbound/tun/
# https://wiki.metacubex.one/config/dns/
# TUN 使用官方当前推荐的 mips；旧内核不支持时恢复 mixed。可选新字段保持注释，按需开启。
tun:
  enable: true                                                      # 开启tun
  stack: mips                                                       # 官方当前默认/推荐自研栈；可选 system / gvisor / mixed / mips
  # congestion-controller: cubic                                    # 仅 MIPS TCP 栈有效；可选 cubic / reno / bbr / bbr3，默认 cubic
  # 不改变 Linux 系统或远端节点的拥塞算法；auto-redirect 接管的 TCP 不经过这层 TUN TCP 栈。
  # dns-mode: hijack                                                # 系统 DNS 设置与附加 53 端口拦截，不是 dns.enhanced-mode
  # disabled: 不设置系统 DNS、不增加该附加拦截；native: 平台支持时将系统 DNS 指向 TUN。
  # hijack: 在 native 基础上增加拦截，Linux 需 auto-redirect，Windows 需 strict-route。
  # 留空保持旧行为：Windows/Linux 开 auto-route 默认 hijack，否则 disabled；macOS 默认 disabled。
  # disabled 不会取消下面的 dns-hijack，也不会撤销 Nikki 自身的 DNS 规则。
  dns-hijack: ["any:53", "tcp://any:53"]                            # 匹配进入 TUN 的 UDP/TCP 53 查询，交给内部 DNS；不拦截 DoH/DoT
  #device: nikki                                                    # 可选固定 TUN 网卡名；使用 Nikki 时以插件实际混入配置为准
  auto-route: true                                                  # 自动设置将目标流量送入 TUN 的路由
  auto-redirect: true                                               # Linux 自动配置 TCP 重定向，需 auto-route；非 TUN TCP 栈路径
  auto-detect-interface: true                                       # 自动接口选择
  route-exclude-address-set:                                        # 目的 IP 命中规则集时旁路接管；Linux 需 nftables、auto-route、auto-redirect
    - 国内ip
  endpoint-independent-nat: true                                    # 端点独立 NAT 选项，适用性取决于协议栈；不保证联机 NAT 等级
  udp-timeout: 300                                                  # UDP NAT 过期时间，以秒为单位
  mtu: 1500

# DNS模块：决定解析上游和返回 real-ip / fake-ip；接管方式在上面的 tun 中配置。
dns:
  enable: true                                                      # 启用DNS模块
  cache-algorithm: arc                                              # 缓存算法 lru / arc，官方默认 lru；本模板选择 arc
  prefer-h3: false                                                  # 不优先使用 DoH/HTTP3；开启 respect-rules 时官方强烈不建议同时开启
  listen: 0.0.0.0:7874                                              # DNS UDP/TCP 监听；保留本模板端口，修改需同步外部 DNS 链
  ipv6: true                                                        # DNS 是否返回 AAAA；false 返回空 AAAA，不等于关闭全局 IPv6
  respect-rules: true                                               # 连接 DNS 上游时遵循路由规则；必须配置 proxy-server-nameserver
  use-hosts: true                                                   # 是否回应配置中的 hosts，默认 true
  use-system-hosts: false                                           # 查询系统 hosts，官方默认 true；本模板保持 false，按需开启
  enhanced-mode: redir-host                                         # 增强模式，支持 redir-host 和 fake-ip 两种模式


# default-nameserver 仅用于解析 DNS 上游自身的域名，服务器地址必须是 IP，可用加密 DNS。
# 本模板上游均用数字 IP，通常无需这一步；省略此项会采用内核默认列表，不代表禁用基础 DNS。
#  default-nameserver:
#    - tls://223.5.5.5                      # 阿里 DNS
#    - tls://120.53.53.53                   # 这个是腾讯的 DNS，默认的119不支持这些写法


# DIRECT 出口需要解析域名时使用的上游；保留国内 DoH，避免普通 UDP 53 被再次接管。
  direct-nameserver: &cn_dns               # 这里定义锚点给下方使用
    - https://223.5.5.5/dns-query          # 阿里 DNS
    - https://120.53.53.53/dns-query       # 腾讯 DNS（加密查询地址）

  # direct-nameserver-follow-policy: false                          # 默认 false；true 时 DIRECT 解析遵循 nameserver-policy
  # 仅在 direct-nameserver 非空时生效，本模板保持原来的默认行为。

# 解析代理节点时使用的DNS，最好设置为国内DNS，否则在代理的第一步就可能因为连接不上国外DNS而解析不出代理节点的IP，最终倒在起点
  proxy-server-nameserver: *cn_dns
  # proxy-server-nameserver-policy:                                 # 可选：仅覆盖代理节点域名，不是业务域名；需配置上述节点 DNS
  #   "node.example.com": *cn_dns


# 指定域名查询的解析服务器，可使用 geosite, 优先于 nameserver/fallback 查询
  nameserver-policy:
# 局域网与反向解析交给系统 DNS；须确保系统 DNS 不再转回本监听端口，否则仍可能形成循环。
    "geosite:private": system
    "+.arpa": system
# 国内域名
    "geosite:cn,category-cdn-cn,category-games@cn,tencent-games,steam@cn": *cn_dns
    "rule-set:游戏下载,微软cn,苹果cn,谷歌cn": *cn_dns


# Redir-Host 模板按业务指定 DNS 上游的连接策略组；#组名 优先于 respect-rules。
# 同一个策略组不保证 DNS 与业务连接使用同一出口 IP，尤其是智能/自动选择组；有固定出口需求需另行约束。
    "rule-set:ChatGPT,Claude,Meta AI,Perplexity,Gemini,Copilot,AI服务": [ "https://1.1.1.1/dns-query#AI服务&disable-ipv6=true", "https://8.8.8.8/dns-query#AI服务&disable-ipv6=true" ]
    "rule-set:油管视频": [ "https://1.1.1.1/dns-query#油管视频&disable-ipv6=true", "https://8.8.8.8/dns-query#油管视频&disable-ipv6=true" ]
    "rule-set:电报域名": [ "https://1.1.1.1/dns-query#电报消息&disable-ipv6=true", "https://8.8.8.8/dns-query#电报消息&disable-ipv6=true" ]
    "rule-set:Twitter": [ "https://1.1.1.1/dns-query#Twitter&disable-ipv6=true", "https://8.8.8.8/dns-query#Twitter&disable-ipv6=true" ]
    "rule-set:TikTok": [ "https://1.1.1.1/dns-query#TikTok&disable-ipv6=true", "https://8.8.8.8/dns-query#TikTok&disable-ipv6=true" ]
    "rule-set:GitHub": [ "https://1.1.1.1/dns-query#GitHub&disable-ipv6=true", "https://8.8.8.8/dns-query#GitHub&disable-ipv6=true" ]
    "rule-set:Bybit": [ "https://1.1.1.1/dns-query#Bybit服务&disable-ipv6=true", "https://8.8.8.8/dns-query#Bybit服务&disable-ipv6=true" ]
    "rule-set:谷歌域名": [ "https://1.1.1.1/dns-query#谷歌服务&disable-ipv6=true", "https://8.8.8.8/dns-query#谷歌服务&disable-ipv6=true" ]
    "rule-set:代理顶级域名,代理域名": [ "https://1.1.1.1/dns-query#代理域名&disable-ipv6=true", "https://8.8.8.8/dns-query#代理域名&disable-ipv6=true" ]


# 未命中 nameserver-policy 时使用的默认解析上游，不是路由 rules 中的 MATCH。
# 上游连接走直连还是代理，由 respect-rules / #策略组决定；使用国外 DNS 本身不保证防泄漏。
# 本模板仅对这些国外上游丢弃 AAAA；需要国外 IPv6 时移除 &disable-ipv6=true，保留 #策略组。
  nameserver:
    - https://1.1.1.1/dns-query#漏网之鱼&disable-ipv6=true  # 国外域名 -> 仅ipv4
    - https://8.8.8.8/dns-query#漏网之鱼&disable-ipv6=true  # 国外域名 -> 仅ipv4

# 节点选择锚点
all: &all { type: select, proxies: [ 新加坡智能, 香港智能, 台湾智能, 日本智能, 美国智能, 其他智能, 自建智能, 新加坡手动, 香港手动, 台湾手动, 日本手动, 美国手动, 其他手动, 自建手动, 全部手动, 新加坡自动, 香港自动, 台湾自动, 日本自动, 美国自动, 其他自动, 自建自动, 直连 ] }
Bybit: &Bybit { type: select, proxies: [ Bybit服务 ] }

# 节点筛选锚点
SG: &SG { filter: "(?i)新加坡|狮城|\\bSG\\b|Singapore" }
HK: &HK { filter: "(?i)香港|\\bHK\\b|HongKong|Hong Kong" }
US: &US { filter: "(?i)美国|美区|美东|美西|\\bUS\\b|United States" }
JP: &JP { filter: "(?i)日本|\\bJP\\b|Japan" }
TW: &TW { filter: "(?i)台湾|台北|新北|\\bTW\\b|Taiwan" }
ZJ: &ZJ { filter: "(?i)自建|workers" }
B: &B { exclude-type: direct, exclude-filter: "(?i)自建|新加坡|狮城|\\bSG\\b|Singapore|香港|\\bHK\\b|HongKong|Hong Kong|美国|美区|美东|美西|\\bUS\\b|United States|加拿大|\\bCA\\b|法国|\\bFR\\b|英国|\\bUK\\b|韩国|\\bKR\\b|朝鲜|古巴|伊朗|乌兹别克|苏丹|叙利亚|俄罗斯|塞瓦斯托波尔|Се" }
Other: &Other { exclude-type: direct, exclude-filter: "(?i)🇭🇰|🇯🇵|🇺🇸|🇸🇬|🇨🇳|香港|\\bHK\\b|HongKong|Hong Kong|台湾|\\bTW\\b|Taiwan|日本|\\bJP\\b|Japan|新加坡|\\bSG\\b|Singapore|美国|美区|美东|美西|\\bUS\\b|United States|自建" }


# 节点分组锚点
# Select 策略通用模板 (用于手动选择)
Select: &Select { type: select, include-all: true, exclude-type: direct }
# Smart 策略通用模板（增强内核专用，保留现有模型和采集链路；不是官方 MetaCubeX 组）
Smart: &Smart { type: smart, include-all: true, uselightgbm: true, collectdata: true, hidden: true, tolerance: 50, <<: *Check, exclude-type: direct }
# Url-Test 策略通用模板 (用于自动选择)
Url-Test: &Url-Test { type: url-test, include-all: true, <<: *Check, tolerance: 50, hidden: true, exclude-type: direct }
# Fallback 策略通用模板 (用于故障转移)
Fallback: &Fallback { type: fallback, <<: *Check, include-all: true, hidden: true, lazy: false }
# Round-Robin 策略通用模板 (用于轮询负载均衡)
# 轮询会循环使用列表中的节点，适用于需要平均分配负载的场景
RR: &RR { type: load-balance, strategy: round-robin, include-all: true, tolerance: 50, <<: *Check,hidden: true, exclude-type: direct }
# Load-Balance (散列) 策略通用模板
# 适用于需要保持客户端连接一致性（例如，防止频繁切换 IP 导致登录失效）的场景
CH: &CH { type: load-balance, strategy: consistent-hashing, include-all: true, tolerance: 50,<<: *Check,hidden: true, exclude-type: direct }

# 锚点里面的 hidden: true 表示隐藏这个代理组，不会在代理列表中显示，但仍然可以在规则中使用它们。适合用于不需要手动更改的分组，比如自动选择、智能选择等。


