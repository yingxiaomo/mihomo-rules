# 规则并不是越多越好，在满足自己需求情况下，尽量做到精简，不要过度复杂，以免影响性能。

# 仅自用，要用的可以根据自己需求修改一下。

# 本模板保留增强内核的 smart + uselightgbm / collectdata，未迁移为 smart-pld；MetaCubeX 官方内核不支持此 Smart 组。

# 连通性检查通用锚点
Check: &Check { url: "https://www.gstatic.com/generate_204", interval: 180, timeout: 5000, expected-status: 204 }

# 无用节点过滤锚点
Provider: &Provider { exclude-filter: "(?i)官网|流量|到期|重置|剩余|套餐|续费|地址|更新|有效|直连|导航" }


# 机场订阅
proxy-providers:
  Airport1:                                                        # 添加多个机场不要重复命名
    url: "机场订阅"                                                 # 机场订阅地址
    type: http                                                     # 订阅类型
    interval: 86400                                                # 订阅更新频率，单位为秒，86400秒即24小时
    <<: *Provider                                                  # 引用锚点过滤无用节点
    health-check:                                                  # 启用节点连通性检查
      enable: true                                                 # 是否启用连通性检查
      url: https://www.gstatic.com/generate_204                    # 用于检查节点连通性的网址
      interval: 300                                                # 检查频率，单位为秒
      expected-status: 204                                         # 仅将返回 204 的探测视为成功，避免错误页被当成可用
    proxy: DIRECT                                                  # 订阅下载时使用的代理名称，若不需要可删除此行，DIRECT表示直连
    override:
      ip-version: ipv4-prefer                                      # ipv4-prefer: 优先使用 IPv4，对于 TCP 会进行双栈解析，并发链接但是优先使用 IPv4 链接，UDP 则为双栈解析，获取结果中的第一个 IPv4
#      additional-prefix: ""                                       # 自定义节点名字前缀
#      additional-suffix: ""                                       # 自定义节点名字后缀
#      skip-cert-verify: false                                     # 是否跳过节点的证书验证，默认为 false
      udp: false                                                   # 本模板关闭订阅节点的 UDP 转发；不是关闭全局 UDP
      # REALITY 可选覆写：只作用于已有 public-key 的 VLESS REALITY 节点，不会修改 public-key、short-id 或 udp。
      # 第一条仅补齐缺失/禁用的 client-fingerprint；第二条仅在服务端明确兼容 X25519-MLKEM768 时启用。
      # Xray-core v26.7.11+ 还有官方文档标明的主动不兼容，此选项不能解决；混合服务端请按节点名继续收窄条件。
      # override-expr:
      #   - '(select(.type == "vless" and .reality-opts.public-key != null and .reality-opts.public-key != "" and (.client-fingerprint == null or .client-fingerprint == "" or .client-fingerprint == "none")) | .client-fingerprint) = "chrome"'
      #   - '(select(.type == "vless" and .reality-opts.public-key != null and .reality-opts.public-key != "") | .reality-opts.support-x25519mlkem768) = true'

# 要添加多个机场就把上面的整个 Airport1 块复制粘贴，改个名字就行了


# 全局配置
port: 7890                                                         # HTTP(S) 代理端口
socks-port: 7891                                                   # SOCKS5 代理端口
redir-port: 7892                                                   # 流量转发端口
mixed-port: 7893                                                   # HTTP(S)&SOCKS5 混合代理端口
tproxy-port: 7894                                                  # TProxy 代理端口（用于透明代理）
allow-lan: true                                                    # 允许局域网
bind-address: "*"                                                  # 绑定局域网 IP，* 表示监听所有地址
ipv6: true                                                         # ipv6，false表示关闭
unified-delay: true                                                # 启用统一延迟，显示节点到目标站点的真实延迟
tcp-concurrent: true                                               # 开启 TCP 并发
log-level: info                                                    # 日志等级
mode: rule                                                         # 运行模式
find-process-mode: 'off'                                           # 进程匹配模式（always: 总是匹配；strict: 严格匹配；off: 关闭）
# interface-name: en0                                              # 强制绑定出口网卡
global-ua: clash.meta                                              # 外部资源下载 UA；当前内核默认会附带版本号，保留本模板自定义值
keep-alive-idle: 600                                               # 内核 TCP 连接的空闲保活时间，单位秒；不是手机省电设置
keep-alive-interval: 15                                            # 内核 TCP 保活探测间隔，单位秒
disable-keep-alive: false                                          # 是否禁用保活机制（false 表示维持开启，有利于连接稳定）
profile:
  store-selected: true                                             # 记忆上次选中的节点，重启后无需重新选择
  store-fake-ip: false                                             # fake-ip 缓存，false表示关闭
ntp:
  enable: false                                                    # 是否启用 NTP 服务
  write-to-system: false                                           # 是否将 NTP 时间写入系统，需要管理员权限
  server: time.apple.com                                           # NTP 服务地址，默认 time.apple.com
  port: 123                                                        # NTP 服务端口，默认 123
  interval: 30                                                     # NTP 同步间隔，单位为秒，默认 30 秒


